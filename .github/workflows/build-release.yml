name: Build & Dispatch to Telegram

on:
  push:
    branches: [ main, feat/penumbra-gui-update ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional build note'
        required: false
        default: 'Manual trigger build'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: penumbra-gui-linux-x86_64
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: penumbra-gui-windows-x86_64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libwayland-dev libxkbcommon-dev libgl1-mesa-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Compile release binaries
        id: compile
        run: |
          START_TIME=$(date +%s)
          cargo build --release --workspace --target ${{ matrix.target }}
          END_TIME=$(date +%s)
          BUILD_DURATION=$((END_TIME - START_TIME))
          echo "build_duration=${BUILD_DURATION}s" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package artifacts & generate hashes (Linux)
        if: runner.os == 'Linux'
        id: pkg_linux
        run: |
          STAGING="${{ matrix.artifact_name }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/penumbra-gui "$STAGING/"
          cp target/${{ matrix.target }}/release/antumbra "$STAGING/"
          cp README.md LICENSE "$STAGING/" 2>/dev/null || true
          
          ARCHIVE="${{ matrix.artifact_name }}.tar.gz"
          tar -czvf "$ARCHIVE" "$STAGING"
          
          HASH=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          SIZE=$(du -h "$ARCHIVE" | awk '{print $1}')
          
          echo "archive_path=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Package artifacts & generate hashes (Windows)
        if: runner.os == 'Windows'
        id: pkg_win
        shell: bash
        run: |
          STAGING="${{ matrix.artifact_name }}"
          mkdir -p "$STAGING"
          cp target/${{ matrix.target }}/release/penumbra-gui.exe "$STAGING/"
          cp target/${{ matrix.target }}/release/antumbra.exe "$STAGING/"
          cp README.md LICENSE "$STAGING/" 2>/dev/null || true
          
          ARCHIVE="${{ matrix.artifact_name }}.zip"
          7z a "$ARCHIVE" "$STAGING"
          
          HASH=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          SIZE=$(du -h "$ARCHIVE" | awk '{print $1}')
          
          echo "archive_path=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "sha256=$HASH" >> $GITHUB_OUTPUT
          echo "file_size=$SIZE" >> $GITHUB_OUTPUT

      - name: Upload artifact to Telegram
        shell: bash
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret is missing. Skipping Telegram upload."
            exit 0
          fi

          if [ "${{ runner.os }}" = "Linux" ]; then
            ARCHIVE="${{ steps.pkg_linux.outputs.archive_path }}"
            HASH="${{ steps.pkg_linux.outputs.sha256 }}"
            SIZE="${{ steps.pkg_linux.outputs.file_size }}"
          else
            ARCHIVE="${{ steps.pkg_win.outputs.archive_path }}"
            HASH="${{ steps.pkg_win.outputs.sha256 }}"
            SIZE="${{ steps.pkg_win.outputs.file_size }}"
          fi

          DURATION="${{ steps.compile.outputs.build_duration }}"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          BRANCH=${GITHUB_REF_NAME}
          DATE_UTC=$(date -u "+%Y-%m-%d %H:%M:%S UTC")

          CAPTION=$(cat <<EOF
          🛠 <b>PenumbraGUI Build Released!</b>

          🖥 <b>Target OS:</b> <code>${{ matrix.target }}</code>
          📦 <b>File:</b> <code>$ARCHIVE</code>
          📏 <b>Size:</b> <code>$SIZE</code>
          ⏱ <b>Compile Time:</b> <code>$DURATION</code>
          🌿 <b>Branch:</b> <code>$BRANCH</code>
          📌 <b>Commit:</b> <code>$COMMIT_SHA</code> ("$COMMIT_MSG")
          🕒 <b>Timestamp:</b> <code>$DATE_UTC</code>

          🔐 <b>SHA-256 Checksum:</b>
          <code>$HASH</code>
          EOF
          )

          curl -s -F document=@"$ARCHIVE" \
                  -F chat_id="$TG_CHAT_ID" \
                  -F parse_mode="HTML" \
                  -F caption="$CAPTION" \
                  "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument"
